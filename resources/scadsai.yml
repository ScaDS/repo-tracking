  description: 'Webis Wikipedia-IPC
  
  
    When an image is reused on the Web, an original caption is often assigned. We hypothesize
    that different captions for the same image naturally form a set of mutual paraphrases.
    To demonstrate the suitability of this idea, we analyzed captions in the English
    Wikipedia, where editors frequently relabel the same image for different articles.
    As a result, the Wikipedia-IPC (Image caption Paraphrase Corpus) dataset was created
    which include caption pairs of the same image which represent paraphrases. It contains
    30,237 gold, 229,877 silver, and 656,560 bronze quality paraphrase pairs.'
