  description: "This package contains TIRA, a platform for replicability and comparison\
    \ of information retrieval experiments.\n\n&nbsp;\n\nPaper Abstract\n\nA major obstacle\
    \ to the long-term impact of most shared tasks is their lack of reproducibility.\
    \ Often only the test collections and the papers of the organizers and participants\
    \ are published. Third parties who want to independently evaluate the state of the\
    \ art for a task on other data must re-implement the participants&rsquo; software.\
    \ The tools developed to collect software from participants in shared tasks only\
    \ partially verify its reliability at the time of&nbsp; submission, much less long-term,\
    \ and do not enable third parties to reuse it later. We have overhauled the TIRA\
    \ Integrated Research Architecture to address all of these issues. The new version\
    \ simplifies task setup for organizers and software submission for participants,\
    \ scales from a local computer to the cloud, supports on-demand resource allocation\
    \ up to parallel CPU and GPU processing, and enables export for local reproduction\
    \ with just a few lines of code. This is achieved by implementing the TIRA protocol\
    \ with an industry-standard continuous integration and deployment (CI/CD) pipeline\
    \ using Git, Docker, and Kubernetes.\n\n&nbsp;\n\nLinks\n\nLink to paper on Springer:\
    \ Continuous Integration for Reproducible Shared Tasks with TIRA.io\n\nLink to paper\
    \ on Webis: Continuous Integration for Reproducible Shared Tasks with TIRA.io\n\n\
    &nbsp;\n\nCitation\n\nIf you use TIRA in your own research, please be sure to cite\
    \ our paper\n\n@InProceedings{froebe:2023b,\n  address =                  {Berlin\
    \ Heidelberg New York},\n  author =                   {Maik Fr{\\\"o}be and Matti\
    \ Wiegmann and Nikolay Kolyada and Bastian Grahm and Theresa Elstner and Frank Loebe\
    \ and Matthias Hagen and Benno Stein and Martin Potthast},\n  booktitle =      \
