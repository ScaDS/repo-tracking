  description: This dataset contains seismic and meteorological measurements from
    a field experiment on tree sway dynamics at the ECOSENSE site in 2024/2025. Ground-based
    seismometers and accelerometers on trees recorded responses to wind forcing, complemented
    by wind velocity data. The dataset supports the analyses in the manuscript 'The
    Seismic Fingerprint of Wind-Induced Tree Sway' (submitted, 2025). Data are provided
    as time series and derived spectral features, with gap intervals documented. See
    README.txt for details on format and usage.
