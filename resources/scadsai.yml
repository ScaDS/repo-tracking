  description: "This package contains ChatNoir Resiliparse, a collection of robust and\
    \ fast processing tools for parsing and analyzing web archive data.\n\n&nbsp;\n\n\
    Paper Abstract Elastic ChatNoir\n\nElastic ChatNoir is an Elasticsearch-based search\
    \ engine offering a freely accessible search interface for the two ClueWeb corpora\
    \ and the Common Crawl, together about 3&nbsp;billion web pages. Running across\
    \ 130&nbsp;nodes, Elastic ChatNoir features subsecond response times comparable\
    \ to commercial search engines. Unlike most commercial search engines, it also offers\
    \ a powerful API that is available free of charge to IR&nbsp;researchers. Elastic\
    \ ChatNoir&rsquo;s main purpose is to serve as a baseline for reproducible IR&nbsp;experiments\
    \ and user studies for the coming years, empowering research at a scale not attainable\
    \ to many labs beforehand, and to provide a platform for experimenting with new\
    \ approaches to web search.\n\n&nbsp;\n\nPaper Abstract FastWARC\n\nWeb search and\
    \ other large-scale web data analytics rely on processing archives of web pages\
    \ stored in a standardized and efficient format. Since its introduction in 2008,\
    \ the IIPC&#39;s Web ARCive (WARC) format has become the standard format for this\
    \ purpose. As a list of individually compressed records of HTTP requests and responses,\
    \ it allows for constant-time random access to all kinds of web data via off-the-shelf\
    \ open source parsers in many programming languages, such as WARCIO, the de-facto\
    \ standard for Python. When processing web archives at the terabyte or petabyte\
    \ scale, however, even small inefficiencies in these tools add up quickly, resulting\
    \ in hours, days, or even weeks of wasted compute time. Reviewing the basic components\
    \ of WARCIO and analyzing its bottlenecks, we proceed to build FastWARC, a new high-performance\
    \ WARC processing library for Python, written in C++/Cython, which yields performance\
    \ improvements by factors of 1.6-8x.\n\n&nbsp;\n\nLinks\n\nLink to papers on Springer\
    \ and ArXiv:\n\n\n\tElastic ChatNoir: Search Engine for the ClueWeb and the Common\
    \ Crawl, \n\tFastWARC: Optimizing Large-Scale Web Archive Analytics\n\n\nLink to\
    \ papers on Webis:\n\n\n\tElastic ChatNoir: Search Engine for the ClueWeb and the\
    \ Common Crawl,\n\tFastWARC: Optimizing Large-Scale Web Archive Analytics\n\n\n\
    &nbsp;\n\nCitation\n\nIf you use ChatNoir or any of its tools (like Resiliparse)\
    \ for a publication, please be sure to cite our paper:\n\n@InProceedings{bevendorff:2018,\n\
    \  address =             {Berlin Heidelberg New York},\n  author =             \
    \ {Janek Bevendorff and Benno Stein and Matthias Hagen and Martin Potthast},\n \
    \ booktitle =           {Advances in Information Retrieval. 40th European Conference\
    \ on IR Research (ECIR 2018)},\n  editor =              {Leif Azzopardi and Allan\
    \ Hanbury and Gabriella Pasi and Benjamin Piwowarski},\n  month =              \
    \ mar,\n  publisher =           {Springer},\n  series =              {Lecture Notes\
    \ in Computer Science},\n  site =                {Grenoble, France},\n  title =\
    \               {{Elastic ChatNoir: Search Engine for the ClueWeb and the Common\
    \ Crawl}},\n  year =                2018\n}\n\n&nbsp;\n\nIf you use FastWARC, you\
    \ can also cite this paper:\n\n@InProceedings{bevendorff:2021,\n  author =     \
    \           {Janek Bevendorff and Martin Potthast and Benno Stein},\n  booktitle\
    \ =             {3rd International Symposium on Open Search Technology (OSSYM 2021)},\n\
    \  editor =                {Andreas Wagner and Christian Guetl and Michael Granitzer\
    \ and Stefan Voigt},\n  month =                 oct,\n  publisher =            \
    \ {International Open Search Symposium},\n  site =                  {CERN, Geneva,\
    \ Switzerland},\n  title =                 {{FastWARC: Optimizing Large-Scale Web\
    \ Archive Analytics}},\n  year =                  2021\n}\n\n&nbsp;"
