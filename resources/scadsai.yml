    can support scientific work, from writing and coding to data analysis and literature
    research. It explains the functioning and limitations of AI systems, highlights
    the importance of effective prompt engineering, and compares commercial and data‑secure
    academic tools. Emphasis is placed on critical evaluation, responsible use, and
    transparent reporting of AI‑generated content. Practical exercises illustrate
    how researchers can safely integrate AI into their workflows.
