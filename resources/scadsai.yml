  description: 'The Datasets for the Information Retrieval Course at the University
    Leipzig and Jena in Summer Term 2023

    This repository contains resources coupled to ir_datasets and TIREx for IR courses
    that focus their hands-on labs on shared tasks. During the IR exercises in summer
    term 2023, we collaboratively developed and evaluated IR systems in a shared task
    style setup, covering corpus creation, system development, and statistical analysis.
    The resulting artifacts, i.e., the documents, topics, runs, relevance judgments
    can be browsed at https://tira-io.github.io/ir-lab-sose-23. This zenodo artifact
    contains all of the underlying datasets used and produced during the course together
    with instructions on how to easily access the data using ir_datasets.

    Overview of resources

    This dataset contains the resources used and created during the IR course at https://temir.org/teaching/information-retrieval-ss23/information-retrieval-ss23.html.

    The artifact contains the following files:


    &nbsp;iranthology-20230618-training-inputs.zip containing the inputs to systems,
    i.e., containing the document corpus and the topics.

    iranthology-20230618-training-truths.zip containing the truth to evaluate and
    tune systems, i.e., the topics and relevance judgments.


    &nbsp;Accessing the Data with ir_datasets

    We provide wrapper code to easily access the resources with ir_datasets:

    # this loads a patched version of ir_datasets that can load resources from TIRA

    from tira.third_party_integrations import ir_datasets


    dataset = ir_datasets.load(''ir-lab-jena-leipzig-sose-2023/iranthology-20230618-training'')

    Similarly, the same is possible with the ir_datasets integration to PyTerrier:

    from tira.third_party_integrations import ensure_pyterrier_is_loaded

    import pyterrier as pt


    # this patches ir_datasets and loads PyTerrier so that it can load resources from
    TIRA and can run in the TIRA sandbox

    ensure_pyterrier_is_loaded()


    dataset = pt.datasets.get_dataset(''irds:ir-lab-jena-leipzig-sose-2023/iranthology-20230618-training'')'
