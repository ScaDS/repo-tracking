  description: '

    SemRepo is a large-scale RDF knowledge graph of GitHub repositories linked to
    scientific research. SemRepo captures fine-grained repository-level metadata (e.g.,s
    contributors, issues, dependencies, programming language) and interlinks this
    information with external scholarly knowledge graphs: repositories are connected
    to publications in&nbsp;LPWC, repository authors are linked to their profiles
    in&nbsp;SemOpenAlex, and research artifacts (e.g., datasets, experiments) are
    linked via&nbsp;MLSea KG.

    SemRepo provides infrastructure for large-scale analysis of research software
    within the broader scientific ecosystem. This Zenodo release includes:


    RDF data dumps (TTL and N-Triples formats)

    SemRepo ontology (OWL)

    VoID description for dataset statistics, interlinks, and access points

    DCAT metadata description for catalog and distribution metadata


    SemRepo&rsquo;s documentation are available at:&nbsp;Github repository🌐&nbsp;Project
    website: https://semrepo.orgSemRepo is released under the&nbsp;CC0 license to
    maximize reuse and interoperability; users are nevertheless encouraged to cite
    the dataset and associated publication.

    '
