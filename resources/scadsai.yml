  description: Generative Artificial Intelligence (GenAI) systems are revolutionizing
    the way humans interact with computers. Cumbersome tasks such as finding relevant
    documents for answering specific questions can suddenly be supported by computers
    to a degree that full automation appear within reach. Systems which achieve this
    level of autonomy are referred to as AI-agents. AI-agents can&nbsp;answer emails,
    make appointments, browse all documents an institution ever created, and all that
    within seconds or minutes. However, when we enable GenAI systems to answer questions
    on our behalf, this also opens doors for new kinds of cybersecurity attacks. In
    this webinar, organized by the Leipzig University and&nbsp;funded by the&nbsp;Arqus
    Innovation Fund&nbsp;(2025 call), we will see AI-agents in action helping with
    administrative tasks and for scientific question wwriting and reviewing. We will
    learn about "Prompt Injections" and what attack-angles these systems potentially
    open and which measures that can be taken to keep AI-agents under control with
    state-of-the-art technology.
