  description: "This dataset contains evaluation data of the paper &quot;Reinforcement\
    \ Learning Control of a Biomechanical Model of the Upper Extremity&quot;.\n\nMotivation\n\
    \nWe address the question whether the assumptions of signal-dependent and constant\
    \ motor noise in a full skeletal model of the human upper body, together with the\
    \ objective of movement time minimization, can predict reaching movements.\n\nFor\
    \ evaluation of the learned policy, two tasks are defined in the paper: a Fitts&#39;\
    \ Law type task and an elliptic via-point task.\n\nGeneral description of the dataset\n\
    \n\n\tFitts&#39; Law Type Task\n\n\t\n\t\tThis dataset incorporates detailed information\
    \ of all 6500 synthesized movements generated in the Fitts&#39; Law type task (following\
    \ the ISO 9241-9 standard).\n\t\t\n\t\tFor each of the 10 task conditions differing\
    \ in distance between targets (&quot;dist&lt;xxx&gt;&quot; in filename)\n\t\tand\
    \ ID (&#39;ID&lt;xxx&gt;&#39; in filename), there are two .csv-files:\n\t\t- one\
    \ with detailed trajectory information on a sample-to-sample basis (&quot;ISO_SAMPLES&quot;\
    \ in filename), and\n\t\t- one with aggregated movement information on an episode\
    \ basis (&quot;ISO_METRICS&quot; in filename).\n\t\t\n\t\t\n\t\tIn addition, for\
    \ each task condition and each of the 13 movement directions in the Fitts&#39; Law\
    \ type task,\n\t\twe include 6 figures: Position, Velocity, and Acceleration Profiles,\
    \ as well as 3D movement path, Phasespace, and Hooke plots.\n\t\tApart from the\
    \ 3D plots, all figures use centroid projections of the respective trajectory onto\
    \ the vector between initial and target position.\n\t\tThe first integer in the\
    \ file name denotes the movement direction number, starting with &quot;0&quot; for\
    \ movements between the targets 1 and 2, &quot;1&quot; for movements between the\
    \ targets 2 and 3 etc.\n\t\tThe file &quot;6_distance0.35_ID2_policy2100000_phasespace.png&quot;,\
    \ e.g., shows velocity plotted againt position for all 50 movements between the\
    \ targets 7 and 8 in the task condition with ID 2 and 35cm diameter of the target\
    \ circle (see Fig 2 in Paper).\n\t\t\n\t\n\t\n\t\n\tElliptic Task\n\n\t\n\t\t\n\t\
    \tThis dataset also contains two CSV-files with data of the trajectory generated\
    \ by the final policy in the elliptic task:\n\t\t- one with detailed trajectory\
    \ information on a sample-to-sample basis (&quot;ELLIPSE_SAMPLES&quot; in filename),\
    \ and\n\t\t- one with aggregated movement information on an episode basis, where\
    \ a new episode starts\n\t\twhenever the target on the ellipse given to the policy\
    \ switches (&quot;ELLIPSE_METRICS&quot; in filename).\n\t\t\n\t\n\t\n\n\nDescription\
    \ of the .csv-files\n\n\n\tSAMPLES Files\n\n\t\n\t\t&quot;time&quot;: time after\
    \ reaching the initial target (target 1 in Fig 2) for the first time (in seconds)\n\
    \t\t&quot;elv_angle_pos&quot; - &quot;flexion_pos&quot;: angle of respective independent\
    \ DOF (in radians) *\n\t\t&quot;elv_angle_vel&quot; - &quot;flexion_vel&quot;: angular\
    \ velocity of respective independent DOF (in radians/s) *\n\t\t&quot;end-effector_xpos_x&quot;\
    \ - &quot;end-effector_xpos_z&quot;: 3D position of end-effector in global coordinates\
    \ (in meters) *\n\t\t&quot;target_xpos_x&quot; - &quot;target_xpos_z&quot;: 3D position\
    \ of target sphere in global coordinates (in meters) *\n\t\t&quot;end-effector_xvelp_x&quot;\
    \ - &quot;end-effector_xvelp_z&quot;: positional velocities of end-effector (in\
    \ meters/s) *\n\t\t&quot;target_xvelp_x&quot; - &quot;target_xvelp_z&quot;: positional\
    \ velocities of target sphere (in meters/s) *\n\t\t&quot;accsensor_end-effector_x&quot;\
    \ - &quot;accsensor_end-effector_z&quot;: positional acceleration of end-effector\
    \ (in meters/s^2) *\n\t\t&quot;E_elv_angle&quot; - &quot;E_flexion&quot;: activation\
    \ of respective independent DOF *\n\t\t&quot;E_elv_angle_derivative&quot; - &quot;E_flexion_derivative&quot;:\
    \ derivative of activation of respective independent DOF *\n\t\t&quot;difference_vec_x&quot;\
    \ - &quot;difference_vec_z&quot;: vector between the end-effector attached to the\
    \ index finger and the target, pointing towards the target (in meters) *\n\t\t&quot;centroid_vel_projection&quot;:\
    \ projection of end-effector velocity towards target (in meters/s) *\n\t\t&quot;target_width&quot;:\
    \ radius (!) of the target sphere (in meters) *\n\t\t&quot;A_elv_angle&quot; - &quot;A_flexion&quot;:\
    \ action vector\n\t\t&quot;thorax_tx_frc&quot; - &quot;wrist_hand_r3_frc&quot;:\
    \ net external force at respective DOF (including dependent and fixed DOFs such\
    \ as &quot;thorax_tx&quot; (thorax translation))\n\t\t&quot;reward&quot;: reward\
    \ obtained in this step\n\t\t&quot;step_type&quot;: 0=initial step of episode, 1=intermediate\
    \ step of episode, 2=terminal step of episode\n\t\t&quot;target_switch&quot;: whether\
    \ the target switched in this step\n\t\t&quot;discount&quot;: internal value of\
    \ tf-agents (does not correspond to the discount factor gamma, which is additionally\
    \ applied!)\n\t\t&quot;thorax_tx_pos&quot; - &quot;wrist_hand_r3_pos&quot;: angle\
    \ of respective dependent DOF (in radians)\n\t\t&quot;thorax_tx_vel&quot; - &quot;wrist_hand_r3_vel&quot;:\
    \ angular velocity of respective dependent DOF (in radians)\n\t\n\t\n\tMETRICS Files\n\
    \t\n\t\tIndex: episode ID\n\t\t&quot;Init_X&quot; - &quot;Init_Z&quot;: initial\
    \ position in global coordinates (in meters)\n\t\t&quot;Init_X&quot; - &quot;Init_Z&quot;:\
    \ target position in global coordinates (in meters)\n\t\t&quot;Init_Distance&quot;:\
    \ distance between last target (i.e., desired initial position) and current target\
    \ (in meters)\n\t\t&quot;Target_Width_Diameter&quot;: target width diameter (in\
    \ meters)\n\t\t&quot;Movement_ID&quot;: Index of Difficulty of current movement\
    \ (using the Shannon Formulation) (in bits)\n\t\t&quot;target_accuracy&quot;: 1\
    \ - (&lt;remaining distance to target center at the end of the episode&gt;/&lt;target\
    \ radius&gt;) if end-effector is inside target, 0 else\n\t\t&quot;movement_time&quot;:\
    \ duration of the episode (in seconds)\n\t\t&quot;episode_successful&quot;: whether\
    \ episode terminated successfully within the permitted 1.5 seconds\n\t\t&quot;dist2target&quot;:\
    \ remaining distance to target center at the end of the episode (in meters)\n\t\n\
    \t\n\n\n-------------------------------------\n* included in state space"
