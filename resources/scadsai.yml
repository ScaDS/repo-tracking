    viele hei&szlig;t das effizienteres Schreiben von Texten oder auch Programmieren.
    Manche &uuml;bersch&auml;tzen dabei die Qualit&auml;t von generiertem Text, m&uuml;ssen
    auch mal besch&auml;mt zugeben, KI-generierten Text nicht ordentlich kuratiert
    zu haben. Mussten wir vor etwa 20 Jahren lernen, wie man richtig &ldquo;googelt&rdquo;,
    lernen wir heute, wie man richtig &ldquo;promptet&rdquo;. In diesem Vortrag erhalten
