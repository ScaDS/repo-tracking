  description: "Abstract&nbsp; &nbsp;A trigger warning or a content warning is intended\
    \ to enable individuals to make an informed decision about whether to expose themselves\
    \ to potentially distressing content. We introduce trigger warning assignment\
    \ as a multilabel classification task and create the Webis&nbsp;Trigger Warning\
    \ Corpus (WTWC), the first&nbsp;dataset of 1 million fanfiction works from the&nbsp;Archive\
    \ of our Own with up to 36 different&nbsp;warnings per document. To provide a\
    \ reliable catalog of trigger warnings, we carefully&nbsp;mapped institutionally-recommended\
    \ trigger&nbsp;warnings against the millions of free-form tags&nbsp;assigned by\
    \ fanfiction authors and organized&nbsp;them into the first comprehensive taxonomy\
    \ of&nbsp;trigger warnings.\n\n&nbsp;\n\nCode for dehydration&nbsp;&nbsp;&nbsp;https://github.com/webis-de/ACL-23\n\
    \n&nbsp;\n\nCite&nbsp; &nbsp;\n\n@InProceedings{wiegmann:2023a,\n  address = \
