  description: 'EARLS is an openly available pan-European runoff&ndash;reconstruction
    dataset.
  
    As of now it is structured in the following way:&nbsp;
  
  
  
    The `coordinates.csv` file contains basin outlet information with 5 columns: basin
    id (idx), type, estimated latitude (lat) and longitude (lon) of the outlet, and
    the distance to the nearest gauging station.
  
    The `license.md`&nbsp;file contains information about the licensing.
  
    The `shapefile` folder includes a shapefile with all basin boundaries (see: HydroBASINS).
  
    The `reconstructions`&nbsp;folder contains CSV files. Each file is named after the
    basin id and has at least two columns: date and simulation. The simulations are
    given in mm. Additional columns can be used to provide more information. For the
    current EARLS we added two additional columns that provide the remaining parameters
    for the uncertainty estimation.
  
    The `model-card` folder contains 2 files: `model-card.html`, and `earls-crest.png`.
    The html document includes the png as logo and renders a model card. A&nbsp;model
    card is a short summary of the model genesis, designed to increase transparency
    by communicating information about trained models to broad audiences. We include
    all three files in the dataset so that future extensions can adapt them with maximal
    ease. We will also host the markdown files on the main home so that the permanent
    identifier within the model card can be used to access the data from there.
  
    Additional data/folders are optional, but can be used to provide background information.
    For instance, the EARLS contains a `earls-yearly-maximum-streamflow-values-europe.csv`
    file and and `inputs` folder. The former contains the data that we used for Figure
    A5 in the manuscript; the latter comprises the basin-aggregated dynamic and static
    inputs:&nbsp;
  
  
    For the dynamic inputs (derived from E-OBS) we use precipitation in mm per day,
    daily minimum/maximum/average temperature in &deg;C.
  
    For the static inputs (derived form HydroATLAS) we use basin area in square kilometers,
    average elevation in meter, average slopes in degrees, average stream gradient in
    decimeter per kilometer, average long-term air temperature in degrees Celsius, minimum
    long-term air temperature in &deg;C, maximum long-term air temperature in &deg;C,
    a global aridity index, a global climate moisture index, average fraction of sand
    in %, average fraction of clay in %, average fraction of silt in %, and average
    organic carbon content in tons per hectar.
  
  
  
  
    Changelog
  
    v0.5
  
  
    Updates coordinates.csv and the EARLS-technical-data-description.pdf. Made both
    available outside the dataset. Added EARLS-technical-data-description.pdf as the
    basis markdown file for generating the technical description pdf.&nbsp;
  
    Copied coordinates to the outside.&nbsp;
  
  
    v0.4
  
  
    Added a csv file (i.e., `earls-yearly-maximum-streamflow-values-europe.csv`), which
    provides the EARLS data that we used for Figure A5 in the manuscript.&nbsp;
  
  
    v0.3
  
  
    Introduced a changelog. yay.&nbsp;
  
    Little corrections (spelling mistakes etc.) and nicer formatting in the technical
    data description.&nbsp;
  
    Corrected streamflow and variance normalization from hours to daily (affected versions:
    v0.0 and v.0.2; thanks to Corinna Frank).
  
    Corrected technical description of the area from m2 to km2 (thanks to Corrina Frank).
  
    Introduced an example data-file with a single basin (thanks to Juliane Mai).
  
  
    '
