  description: "Come2Data is one of eleven national Data Competence Centres currently\
    \ in development. It aims to foster the proliferation of data competencies and skills\
    \ primarily in academia, but also in public administration, industry and the interested\
    \ public. It follows an interdisciplinary, regional approach by bringing together\
    \ existing data-related teaching, training and support services of the project partners\
    \ (TU Chemnitz, TU Dresden, Leipzig University and Saxon State Library &ndash; Dresden\
    \ State and University Library) as well as expertise and activities on research\
    \ data management (e.g. in SaxFDM), the National Research Infrastructure (NFDI)\
    \ and high-performance computing and analysis methods for data-intensive, interdisciplinary\
    \ research applications, such as artificial intelligence and data modelling (e.g.\
    \ in ScADS.AI). \nInformation on offerings and resources will be aggregated and\
    \ made accessible via a virtual platform serving as a central entry point. Existing\
    \ teaching offers and materials will be didactically overhauled, tailored to different\
    \ target groups and arranged in learning paths on a modular basis. Findings and\
    \ solutions developed as part of pilot projects from various disciplines will be\
    \ integrated. In addition, Come2Data will explore possibilities for the integration\
    \ of data-related content into curricula and teaching as well as certification and\
    \ implement them on a trial basis."
