    - /ground_truth/csv/line_annotations.csv: ground truth texts

    - /ground_truth/csv/word_annotations.csv: ground truth texts

    - /images/pages: 775 full-page images with German handwriting

    - /images/lines: 5.843 line images with German handwriting

    - /images/words: 37.406 word images with German handwriting

    - /metadata/Uni_Leipzig_01-export-251205.csv (further descriptions, e.g. corresponding
    wikipedia urls)

    &nbsp;

    Description

    We offer ground truth files both in XML format and in CSV format with annotated
    words and lines which cover about 90% of the pages (relating on the content in
    Uni_Leipzig_01-export-251205.csv). Annotating partially unreadable hundred of
    manuscripts (775) is hard work and takes a lot of time.

    We provide about 43.249 annotated lines and words from excerpts of Wikipedia articles
    with ground truth text. Handwriting OCR in German is underserved.

    The quality is not perfect. We did our best, but still there are mistakes.

    &nbsp;

