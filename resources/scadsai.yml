    \ the functionality in the software for Evolvable Hardware.\n\nThe conditions for\
    \ the reconfiguration measurements were altered in four dimensions:\n\n\n\tThe FPGA\
    \ board\n\t\n\t\tiCEstick\n\t\t\n\t\t\tLattice iCE40 HX1K FPGA\n\t\t\tSample bitstream\
    \ created by Bitstream Evolution Software\n\t\t\tNo direct reconfiguration possible\n\
    \t\t\n\t\t\n\t\tiCE40 breakout board (ICE40HX8K-B-EVN)\n\t\t\n\t\t\tLattice iCE40\
    \ HX8K FPGA\n\t\t\tSample bitstream created by CoBEA\n\t\t\n\t\t\n\t\n\t\n\tWrite\
    \ Target\n\t\n\t\tFlash\n\t\t\n\t\t\tBitstream first written to an external EEPROM,\
    \ then pulled by the FPGA from the EEPROM\n\t\t\n\t\t\n\t\tDirect\n\t\t\n\t\t\t\
    Bitstream written directly to the FPGA\n\t\t\n\t\t\n\t\n\t\n\tReconfiguration approach\n\
    \t\n\t\tIcestorm\n\t\t\n\t\t\tUse external tools from Project Icestorm\n\t\t\n\t\
