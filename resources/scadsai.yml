    \ This zenodo artifact contains all of the underlying datasets used and produced\
    \ during the course together with instructions on how to easily access the data\
    \ using ir_datasets.\n&nbsp;Overview of resources\nThis dataset contains the resources\
    \ used and created during the IR course at https://temir.org/teaching/information-retrieval-ws23/information-retrieval-ws23.html.\n\
    The artifact in this dataset include the following files:\n\ntraining-20231104-training-inputs.zip\
    \ containing the training inputs of LongEval 2023 to systems, i.e., containing\
    \ the document corpus and the topics.\ntraining-20231104-training-truths.zip containing\
    \ the training truth of LongEval 2023 to evaluate and tune systems, i.e., the\
    \ topics and relevance judgments.\nvalidation-20231104-inputs.zip containing the\
    \ validation inputs of LongEval 2023 to systems, i.e., containing the document\
    \ corpus and the topics.\nvalidation-20231104-truths.zip containing the validation\
    \ truth of LongEval 2023 to evaluate and tune systems, i.e., the topics and relevance\
    \ judgments.\njena-topics-small-20240119-inputs.zip containing the inputs to systems\
    \ created in the course at the University of Jena, i.e., containing the document\
    \ corpus and the topics.\njena-topics-small-20240119-training-truths.zip containing\
    \ the truth to evaluate and tune systems created in the course at the University\
    \ of Jena, i.e., the topics and relevance judgments.\nleipzig-topics-small-20240119-training-inputs.zip\
    \ containing the inputs to systems created in the course at the University of\
    \ Leipzig, i.e., containing the document corpus and the topics.\nleipzig-topics-small-20240119-training-truths.zip\
    \ containing the truth to evaluate and tune systems created in the course at the\
    \ University of Leipzig, i.e., the topics and relevance judgments.\n\nAccessing\
