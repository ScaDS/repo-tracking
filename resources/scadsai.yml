  description: "Data created by an experiment that evolved a tone discriminator on an\
    \ iCE40 FPGA. The experiment was originally conducted by Adrian Thompson on an Xilinx\
    \ XC6200 FPGA in 1997. This is the reproduction on a modern FPGA.\n\n&nbsp;\n\n\
    The tone discriminator is a circuit on the FPGA that creates a 3.3 V output signal\
    \ if presented with a 10 kHz square wave input and a 0 V output signal for a 1 kHz\
    \ input signal. The circuit was evolved with a Genetic Algorithm and evaluated in\
    \ three ways:\n\n\n\tClamping: Iterative process to evaluate which cells in the\
    \ circuit contribute dynamically to the output. A random cell is chosen a and its\
    \ output set to a random constant value. Afterwards the fitness of the circuit is\
    \ measured. If it decreases by less than 1 %, the cell is kept clamped, else reset\
    \ to its original state.\n\tTemperature dependence: The FPGA with the circuit was\
    \ cooled or heated to different temperatures and presented with different input\
    \ frequencies. The output was averaged over 5 s.\n\tLocation dependence: The circuit\
    \ was moved to a different location o the FPGA. The Genetic Algorithm was then continued\
    \ for additional 200 generations.\n\n\n&nbsp;\n\nThis upload contains four groups\
    \ of files:\n\n\n\texperiment.h5\n\t\n\t\tAll measurements and chromosomes from\
    \ the original run of the Genetic Algorithm\n\t\n\t\n\tclamping.h5\n\t\n\t\tAll\
    \ measurements of the clamping process\n\t\n\t\n\ttemperature-XX.h5\n\t\n\t\tAll\
    \ measurements for a different temperature\n\t\tXX is the temperature in degree\
    \ Celsius\n\t\n\t\n\tnew_location-X.h5\n\t\n\t\tAll measurements and chromosomes\
    \ for the continued Genetic Algorithm at a new location on the FPGA\n\t\tX is the\
    \ running number for hundred generations in the file, e.g. 2 contains generations\
    \ 101 to 200\n\t\n\t\n\n\n&nbsp;\n\n&nbsp;\n\nErrata:\n\n\n\tThe timestamps for\
    \ the temperature measurements are missing in all files but experiment.h5.\n\n\n\
    &nbsp;"
