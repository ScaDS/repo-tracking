    JPG data format), a transcription in plain UTF-8 text is provided (can be used
    as ground truth).

    &nbsp;


    Structure

    - images/: one jpg file per handwritten page (a total of 77 items)

    - ground_truth/: one text file per handwritten page (a total of 77 items)

    - metadata/scads_topic_list.csv: dataset description

    - metadata/scads_topic_list.xml: TEI-Lite description

    - metadata/Uni_Leipzig_01-export-251205.csv:&nbsp;contains URLs to the corresponding
    Wikipedia articles

    - README.md

    - license.txt

    The usable dataset includes 77 images with German handwritten Wikipedia excerpts
    and corresponding ground truth text files.

