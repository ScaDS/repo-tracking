  description: The first funding period of NFDI4Chem established a robust foundation
    for research data management (RDM) in chemistry by promoting FAIR data principles
    and creating a cohesive infrastructure to capture well-annotated data early in the
    lab through electronic lab notebooks (ELNs) and making this data available in public
    repositories. Key achievements include standardised data formats and metadata, a
    federated repository environment, and improved data visibility and accessibility.
    Training programs and outreach have significantly increased awareness and adoption
    of best RDM practices. In the second funding period, the consortium aims to advance
    these achievements by consolidating this infrastructure, developing a model for
    its sustainable maintenance and operation, and fostering cultural change for its
    widespread adoption. Goals include ensuring seamless data workflows from laboratories
    to open repositories, enhancing interoperability, and supporting innovative research
    through AI-ready data. The work plan is organised into six task areas (TAs). TA1
    (Management) provides leadership and supports all other TAs in achieving their objectives.
    TA2 (Smart Lab) aims to develop a fully digital research environment, including
    an ELN as a modular platform. This environment will support data collection, management,
    storage, analysis, and sharing. Integrating devices and external resources will
    enable seamless data transfer to repositories. TA3 (Repositories) will consolidate
    the repository ecosystem. The goal is to integrate repositories into a federated
    system for better accessibility and interoperability, ensuring long-term data availability
    and sustainability. TA4 (Metadata, Data Standards, and Publication Standards) focuses
    on developing and promoting new data and metadata standards in an international
    community process. This includes applying ontologies to create a semantic foundation
    for linking research data, making it machine-readable and enabling knowledge graphs.
    TA5 (Community and Training) is dedicated to fostering a cultural shift towards
    digital chemistry through continuous engagement, collecting requirements, and providing
    extensive training and support through workshops and open education resources. It
    will promote FAIR-compliant machine learning applications, embedding RDM into academic
    curricula to ensure future scientists are well-versed in these practices. TA6 (Synergies
    and Cross-Cutting Topics) aims to enhance collaboration across NFDI consortia and
    beyond. This includes developing ontologies, terminology services, the search service,
    and other cross-cutting solutions, integrating these developments into existing
    infrastructure, enabling interdisciplinary data harmonisation and fostering machine
    learning applications.
