  description: "The HDF5 file contains data from an experiment concerning bitstream\
    \ size reduction for Lattice iCE40 FPGAs.\n\nFive projects were synthesized with\
    \ two different toolchains and afterwards compacted and compressed. Two compaction\
    \ levels were applied to each of the ten original bistreams, resulting in a total\
    \ of 30 bitstreams. The ten original bitstreams were also compressed with two different\
    \ compression tools, resulting in 20 compressed versions.\n\nThe reconfiguration\
    \ time for each of the 30 bitstreams was measured 10.000 times.\n\nToolchains:\n\
    \n\n\tLattice iCEcube2\n\tOpen-source toolchain (Yosys, nextpnr, Project IceStorm)\n\
    \n\nProjects:\n\n\n\tblinky: A simple example design that is included in the open-source\
    \ toolchain.\n\tehw: An evolved design.\n\tattosoc: A minimal RISC-V system on a\
    \ chip, that is used for tests in the open-source toolchain.\n\tupdater: A design\
    \ that receives a new configuration, decrypts it (AES) and writes it to flash.\n\
    \tpicosoc: RISC-V system on a chip\n\n\nCompaction levels:\n\n\n\toriginal: Uncompacted\
    \ bitstream\n\tbuiltin: Compacted with two methods also available in iCEcube2\n\t\
    compact: Compacted with all five methods\n\n\nCompression tools:\n\n\n\ticecompr:\
    \ Included in Project IceStorm\n\tgzip: Version 1.9, compression level --best\n\n\
    \n&nbsp;\n\nFile structure:\n\nThe data is organzied hierarchical. It is first split\
    \ between bitstreams, measurements and compressed versions.&nbsp; Bitstreams and\
    \ measurements then are divided by toolchain, then by project and finally by compaction\
    \ level. The compressed versions are divided by toolchain, then by project and finally\
    \ by compression tool."
