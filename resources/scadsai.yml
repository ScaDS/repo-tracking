    \ of the 1st Workshop on Intelligent and Interactive Writing Assistants (In2Writing\
    \ 2022)\",\n    month =     may,\n    year =      \"2022\",\n    address =   \"\
    Online\",\n    publisher = \"Association for Computational Linguistics\",\n\n\
    Datasets\n\nThis repository contains two datasets with word search queries. Each&nbsp;word\
    \ search query consists of a token n-gram with one&nbsp;wildcard token ([MASK]).\
    \ The answers to each query are the most likely token to replace the mask. All\
    \ queries originate from wikitext-103 and CLOTH, the respected source is annotated\
    \ for each query.\n\nThe original-token dataset lists exactly one top answer for\
    \ each query. The&nbsp;ranked-answers dataset lists multiple, sorted answers in\
    \ three relevance categories, where 3 is the most relevant. Please refer to the\
    \ citation for more details."
